<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Låning av Utstyr</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/2.css') }}">
</head>

<body>

    <header class="navbar">
        <a href="{{ url_for('index') }}" class="brand">
            Informasjonsteknologi og medieproduksjon
        </a>

        <nav>
            <a href="{{ url_for('index') }}">Hjem</a>
            <a href="{{ url_for('bestilling') }}">Bestilling</a>
            <a href="{{ url_for('om') }}">Om oss</a>
        </nav>
    </header>

    <main class="bestilling">
        <h1>Låning av utstyr</h1>

        <form method="POST" action="{{ url_for('bestilling') }}">
            <label for="navn">Navn</label>
            <input type="text" id="navn" name="navn" required>

            <label for="klasse">Hvilken klasse går du i?</label>
            <select id="klasse" name="Klasse" required>
                <option value="1IMA">1IMA</option>
                <option value="1IMB">1IMB</option>
                <option value="1IMC">1IMC</option>
                <option value="1IMD">1IMD</option>
                <option value="1IME">1IME</option>
                <option value="1IMF">1IMF</option>
                <option value="2IMM">2IMM</option>
                <option value="3IMM">3IMM</option>
            </select>

            <label for="epost">E-post</label>
            <input type="email" id="epost" name="epost" required>

            <label for="produkter">Hva har du lyst til å låne?</label>
            <select id="produkter" name="produkter" required>
                <option value="" disabled selected>Velg utstyr</option>
                <option value="Kamera">Kamera</option>
                <option value="Videokamera">Videokamera</option>
                <option value="GoPro">GoPro</option>
                <option value="Batterier">Batterier</option>
                <option value="Trådløs mikrofon">Trådløs mikrofon</option>
                <option value="Myggmikrofon">Myggmikrofon</option>
                <option value="Shotgun-mikrofon">Shotgun-mikrofon</option>
                <option value="USB-mikrofon">USB-mikrofon</option>
                <option value="Minnekort">Minnekort</option>
                <option value="Kameraveske">Kameraveske</option>
                <option value="Green screen">Green screen</option>
                <option value="Hodetelefoner">Hodetelefoner</option>
                <option value="Kabler og adaptere">Kabler og adaptere</option>
            </select>

            <button type="submit">Send bestilling</button>
        </form>
    </main>

    <img class="Main1_img" src="{{ url_for('static', filename='bilder/BILDE1.png') }}" alt="Utstyr til låning">

</body>

</html>
